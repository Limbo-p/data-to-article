[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-to-article"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
description = "通用数据到文章流水线：清洗 -> 归类 -> 二创（Storage / Ingest / LLM 接口均可自定义）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymongo>=4.0",
    "PyYAML>=6.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
dta = "data_to_article.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
